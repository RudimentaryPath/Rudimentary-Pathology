    ## Neoplastic

    ### Benign

    #### Lipoma and variants

    - Benign neoplasm of mature adipocytes (single large lipid droplets aka white fat).
    - Most common mesenchymal soft tissue tumor overall in adults, rarely recur.
    - Common on the upper back, shoulders, neck, and abdomen.
    - 40–60 years most common.
    - Lipomas are well-circumscribed, homogeneous masses typically measuring under 5.0 cm.

    ##### Angiolipoma

    - Benign adipocytic tumor with prominent vascular component.
    - Often painful or tender.
    - Common in young adults.
    - Usually subcutaneous.

    ##### Fibrolipoma

    - Predominantly mature adipose tissue with abundant fibrous tissue.
    - Typically well circumscribed.

    ##### Spindle Cell Lipoma

    - Benign adipocytic neoplasm composed of mature fat and bland spindle cells.
    - Classically occurs in the posterior neck and upper back of older men.

    ##### Hibernoma

    - Benign tumor composed of brown-fat-like cells.
    - Often hypervascular.
    - Common in the thigh, shoulder, and trunk.

    ##### Myelolipoma

    - Benign tumor containing mature adipose tissue and hematopoietic tissue.
    - Most commonly arises in the adrenal gland.

    ### Premalignant, Malignant, and Borderline

    #### a. Liposarcoma

    - Tumors arising in the thigh may produce pain from compression of nerves or edema due to venous compression, while retroperitoneal LS may cause hydronephrosis or intestinal obstruction.
    - most important diagnostic feature is the presence of lipoblasts, which are pleomorphic cells containing prominent lipid vacuoles which indent the nucleus.

    #### b. Leiomyosarcoma

    Add information and images here.

    #### c. Synovial sarcoma

    - Peak age being 15-30 years.
    - Sarcoma most commonly occurs in the extremities, most often in the region of the knee, foot and ankle.
    - Rarely involves the joint space despite the name (<10% of lesions).
    - Variable histologic appearance, can be biphasic (classic), monophasic fibrous, monophasic epithelial or poorly differentiated.

    #### Tenosynovial giant cell tumor

    - Acrally located
    - Circumscribed nodule with foamy histiocytes (filled with clear vacuoles and often peripheral), hemosiderin, giant cells, sclerotic/dense collagen, and monomorphic cells.
    - Can be localized-type or diffuse-type (formerly pigmented villonodular synovitis).
    - Large, plump epithelial cells with brisk mitosies, but non-atypical.
    - Staining: CD168 (histiocytes)
