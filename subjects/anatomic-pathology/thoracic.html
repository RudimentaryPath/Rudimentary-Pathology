    ## Congenital, Developmental, and Familial Conditions

    ### Hamartoma

    - Benign neoplasm composed of varying amounts of mesenchymal elements (cartilage, fat, connective tissue, smooth muscle) with entrapped respiratory epithelium.
    - At least 2 mesenchymal elements should be present for diagnosis
    - Most common benign pulmonary neoplasm, often incidentally found
    - Epidemiology M > F, peak in the sixth decade, rare in children

    ### Congenital cystic lesions

    - **Bronchogenic cyst**
    - Benign congenital malformation of tracheobronchial tree arising from abnomral primitive foregut budding during gestation.
    - It occurs in mediastinum, lung, head, and neck, skin, abdomen, and the retroperitoneum.
    - Typically defined by unilocular cyst lined by repsiratory type epithelium with a wall that resembles bronchial walls with variable amounts of seromucinous glands, cartilage, and smooth muscle.
    - Excellent prognosis with complete surgical excision.

    - **Congenital Pulmonary Airway Malformation (CPAM)**
    - Congenital pulmonary airway malformations encompass a spectrum of cystic and noncystic lung malformations that develop in utero. Cysts are interconnected with alveolar airspaces, and are typically lined with ciliated columnar epithelium.
    - *Type 1 (large cyst) CPAM*
    - Grossly cystic lung lesion Largest cyst size is highly variable and ranges from < 0.5 cm to > 7 cm in greatest dimension.
    - Cysts are interspersed with relatively normal appearing lung parenchyma (alveoli are enlarged and simplified)
    - No mucocele
    - *Type 2 (small cyst) CPAM*
    - Variable gross appearance In cystic specimens, cysts can measure up to 2.5 cm in greatest dimension and cysts are interspersed with normal appearing lung parenchyma
    - Some specimens may have no grossly identifiable lesion May have a mucocele or grossly evident bronchial atresia.
    - *Type 3 CPAM*
    - Solid / dense appearing lesion, often with a lobulated appearance Lesion is distinct from the uninvolved lung parenchyma
    - May have very small interspersed cysts.

    ## Inflammatory Conditions, Non-Infectious and Infectious Causes

    ### Emphysema

    - Abnormal enlargement of air spaces distal to the terminal bronchioles characterized by destruction of the alveolar septa with little or no fibrosis.
    - Characterized by destruction of acinar structure and airspace enlargement, which affects pulmonary functions and causes chronic respiratory symptoms.

    ## Neoplastic

    ### Benign

    #### Carcinoid tumorlet

    - Tumor of neuroendocrine differentiation, <u>defined by size < 5 mm in diameter, mitotic count < 2 mitoses/2 mm² and absence of necrosis.</u>
    - Can be found incidentally in lung resections but can arise in the context of Diffuse Idiopathic Pulmonary Neuroendocrine Cell Hyperplasia (DIPNECH).
    - Progression to typical carcinoid tumors is possible.

    #### PEComa

    - Perivascular epithelioid cell tumors (PEComas) are mesenchymal neoplasms with perivascular epithelioid cells expressing distinct myoid and melanocytic markers.
    - Divided into benign and malignant subtypes and grouped with lymphangioleiomyomatosis (LAM) under PEComatous tumors in 2021 WHO Classification of Lung Tumors.
    - Tumor is composed of uniform round to polygonal epithelioid cells with clear or granular eosinophilic cytoplasm.
    - Cells are arranged in sheets or nests with perivascular distribution
    - Epithelioid cells are positive for melanocytic or myoid markers
    - Mostly associated with TSC2 mutations

    ### Premalignant, Malignant, and Borderline

    #### Squamous cell carcinoma

    - Squamous Cell Carcinoma in situ Squamous dysplasia precursor lesion arising in squamous metaplasia of the bronchial tree.
    - Can be single or multifocal.
    - Part of a continuum with sequential molecular abnormalities and can morphologically graded from mild dysplasia to SCCIS using similar criteria to upper aerodigestive tract.
    - Respiratory epithelium→ irritant/carcinogen (e.g, smoking)→ hyperplasia→ squamous metaplasia → squamous dysplasia → squamous cell carcinoma in situ → invasive squamous cell carcinoma

    #### Adenocarcinoma

    - Malignant epithelial tumor with glandular differentiation, mucin production, or pneumocyte marker expression
    - Five main histologic patterns (acinar, papillary, micropapillary, lepidic, solid) with mucinous and nonmucinous subtypes
    - Micropapillary and solid patterns have a worse prognosis; increased risk of recurrence
    - Most common cause of death world wide, associated with smoking.
    - 40–60 years most common.
    - Driver Mutations: EGFR, KRAS, ALK rearrangement, ROS1, BRAF, NTRK, RET fusion, HER2 amplificaiton, MET amplificaiton, SMARCA4 LOS
    - Stains: TTF-1, Napsin-A, CK7 Positive

    - **Adenocarcinoma in situ (AIS)**
    - Formerly, “Bronchoalveolar Adenocarcinoma” (BAC)
    - A small (≤ 3 cm), solitary, localized adenocarcinoma with pure lepidic growth (no other patterns allowed).
    - No stromal, vascular, or pleural invasion. No STAS. Mostly non-mucinous. Usually peripheral. Septal widening with sclerosis/elastosis is common. Minimal to moderate nuclear atypia of type II pneumocytes. Frequent intranuclear inclusions.
    - IHC: Express CK7, TTF-1, and Napsin-A. Essentially Benign—100% survival if resected entirely.

    - **Invasive Mucinous Adenocarcinoma**
    - An adenocarcinoma with goblet or columnar cells with abundant intracytoplasmic mucin. Cytologically bland.
    - Any growth pattern may be seen. Even though often lepidic- predominant, usually areas of invasion. Frequently KRAS mutated. Often peripheral, multifocal.
    - IHC: (+) CK7+, (-/+)TTF-1, (+/-)CK20 and CDX2.
    - Need to clinically exclude mucinous metastasis (e.g., pancreas). Poorer prognosis. Often multifocal/multilobar.

    - **Colloid Adenocarcinoma**
    - Adenocarcinoma where pools of abundant extracellular mucin replace alveolar air spaces. Mucin distends the alveolar spaces and destroys walls with invasive growth. Tumor cells often do not entirely line alveoli and may be relatively bland.
    - IHC: Often express CK7 and intestinal markers CDX2, CK20. Must exclude a metastasis clinically.

    - **Enteric Adenocarcinoma**
    - Adenocarcinoma resembling colorectal-type adenocarcinoma with at least 1 intestinal marker.
    - Requires careful clinical evaluation (e.g., colonoscopy and imaging) to exclude a metastasis from an occult GI primary. Eosinophilic, tall columnar cells with pseudostratified nuclei and abundant “dirty” necrosis.
    - IHC: (+)CDX2; (+/-)CK20, CK7, (-/+)TTF1, SATB2.

    - **Fetal Adenocarcinoma**
    - Adenocarcinoma resembling fetal lung in pseudoglandular stage. Complex glandular structures composed of glycogen-rich, non-ciliated cells. Frequent morule formation. “Piano keys” Low-grade: Small, round, monotonous nuclei.
    - Nuclear/cytoplasmic β-catenin, High-grade: Diffuse atypia. Membranous β-catenin. Often combined with other types.
    - IHC: TTF-1(+/-). Frequent neuroendocrine marker, and germ cell marker expression.
