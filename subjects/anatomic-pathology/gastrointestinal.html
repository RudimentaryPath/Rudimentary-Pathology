    # The Digestive System

    ## The Gastrointestinal Tract

    ### The Esophagus

    #### Normal Anatomy and Histology

    - The esophagus is composed of multiple layers similar to the rest of the GI tract; mucosa, muscularis mucosa, submucosa, and muscularis propria.
    - The epithelium is non-keratonized stratified squamous epithelium beginning at the gastroesophageal junction (GE junction) just above the cardia of the stomach up to the oral cavity.
    - At the level of the GE junction, the epithelium of the cardia is foveolar type mucosa with mucinous glands.
    - The muscle of the esophagus is primarily smooth muscle at the distal end, with skeletal muscle at the most proximal end.
    - Normally, there should be a transition from squamous to glandular epithelium at the GE junction, but this point is also key in assessing for Barret's esophagus. Metaplasia of the squamous epithelum (trnasitoin to intesitnal type epithelum with goblet cells) signifies injury and progression twoards the precancerous condition.

    ###### Adenocarcinoma

    - Invasion across the basement membrane → Lamina propria overrun by glands → May see single infiltrating cells, or expansively growing glands without intervening lamina propria.
    - Features associated with EARLY invasion: Luminal necrosis, Prominent Nearly all occur near GE junction due to Barrett’s esophagus. Often present with dysphagia nucleoli, glands growing parallel to the surface.
    - Features associated with DEEP invasion: Angulated glands, Prominent desmoplasia (at least into submucosa likely), Pagetoid spread of malignant cells in squamous epithelium.
